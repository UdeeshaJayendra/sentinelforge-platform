apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelforge-demo
  namespace: default
  labels:
    app: sentinelforge-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelforge-demo
  template:
    metadata:
      labels:
        app: sentinelforge-demo
    spec:
      containers:
        - name: app
          image: 216453078762.dkr.ecr.ap-south-1.amazonaws.com/sentinelforge-demo:476e4d63e94fec12f9afbfa09dbbe2707cd2d750
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelforge-demo
spec:
  selector:
    app: sentinelforge-demo
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP