name: SentinelForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate GitOps manifests
        run: |
          kubectl kustomize platform/gitops/apps/sentinelforge-demo > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: Enforce Kubernetes security policy
        run: |
          echo "Checking Kubernetes security policy..."

          if ! grep -q "readinessProbe:" /tmp/rendered.yaml; then
            echo "FAILED: readinessProbe is required"
            exit 1
          fi

          if ! grep -q "requests:" /tmp/rendered.yaml; then
            echo "FAILED: resource requests are required"
            exit 1
          fi

          if ! grep -q "limits:" /tmp/rendered.yaml; then
            echo "FAILED: resource limits are required"
            exit 1
          fi

          if grep -q "privileged: true" /tmp/rendered.yaml; then
            echo "FAILED: privileged containers are not allowed"
            exit 1
          fi

          if ! grep -q "kind: NetworkPolicy" /tmp/rendered.yaml; then
            echo "FAILED: NetworkPolicy is required"
            exit 1
          fi

          echo "Kubernetes security policy PASSED"
          echo "- readinessProbe: OK"
          echo "- resource requests: OK"
          echo "- resource limits: OK"
          echo "- privileged container: NOT enabled"
          echo "- NetworkPolicy: OK"

      - name: Show rendered manifests
        run: |
          cat /tmp/rendered.yaml

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Build and Scan Container
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t sentinelforge-demo:${{ github.sha }} \
            ./apps/sentinelforge-demo

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sentinelforge-demo:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sentinelforge-demo:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ github.sha }}.json
          scanners: vuln,secret,misconfig

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelforge-demo-sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.json
          retention-days: 7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Tag image for Amazon ECR
        run: |
          docker tag sentinelforge-demo:${{ github.sha }} \
            ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}

      - name: Push image to Amazon ECR
        run: |
          if aws ecr describe-images \
            --repository-name sentinelforge-demo \
            --image-ids imageTag=${{ github.sha }} \
            --region ap-south-1 > /dev/null 2>&1; then
            echo "Image tag already exists in ECR. Skipping push."
          else
            docker push \
              ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          fi

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name sentinelforge-demo \
            --image-ids imageTag=${{ github.sha }} \
            --region ap-south-1 \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          SIGNATURE_TAG="sha256-${DIGEST#sha256:}.sig"

          if aws ecr describe-images \
            --repository-name sentinelforge-demo \
            --image-ids imageTag="$SIGNATURE_TAG" \
            --region ap-south-1 > /dev/null 2>&1; then
            echo "Cosign signature already exists. Skipping signing."
          else
            cosign sign --yes \
              "${{ vars.ECR_REPOSITORY_URI }}@${DIGEST}"
          fi

      - name: Verify container image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name sentinelforge-demo \
            --image-ids imageTag=${{ github.sha }} \
            --region ap-south-1 \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          cosign verify \
            --certificate-identity-regexp "https://github.com/UdeeshaJayendra/sentinelforge-platform/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ vars.ECR_REPOSITORY_URI }}@${DIGEST}"

      - name: Update GitOps image
        run: |
          sed -i "s|image: .*|image: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}|" \
          platform/gitops/apps/sentinelforge-demo/deployment.yaml

      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add platform/gitops/apps/sentinelforge-demo/deployment.yaml

          git commit -m "ci: update demo image to ${{ github.sha }}" || exit 0
          git push